name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    permissions:
      contents: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/python-ci.yml@main
    secrets: inherit
    with:
      has_integration_tests: true

  release:
    if: ${{ vars.AWS_REGION != '' && vars.AWS_RELEASE_ROLE_ARN != '' && vars.ECR_REPOSITORY != '' }}
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/container-release.yml@main

  deploy-staging:
    name: Deploy to staging
    needs: release
    permissions:
      contents: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/kubernetes-gitops-cd.yml@main
    secrets: inherit
